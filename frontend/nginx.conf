map $http_x_forwarded_proto $public_scheme {
    default $scheme;
    "https" https;
}

# Docker's embedded DNS updates service addresses when a container is
# recreated. Resolve the backend continuously so the edge does not retain a
# stale address after rolling restarts or crash recovery.
resolver 127.0.0.11 valid=10s ipv6=off;

# Never record raw request targets, query strings, referrers or client IPs:
# recovery/invitation URLs and document metadata can contain private data.
log_format operational escape=json '{"event":"edge_request","status":$status,"duration_seconds":$request_time}';

upstream api_backend {
    zone api_backend 64k;
    server backend:8000 resolve;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    access_log /dev/stdout operational;
    # Error logs can include the entire request target. API safe error codes,
    # edge status metrics and container health provide content-free diagnosis.
    error_log /dev/null;

    # Match the backend's default 10 MiB PDF admission limit. Operators who
    # lower PDF_MAX_UPLOAD_BYTES should lower this edge limit as well.
    client_max_body_size 10m;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keep the public API under the SPA origin. The trailing slash on
    # proxy_pass strips /api/ before forwarding to FastAPI.
    location ^~ /api/ {
        proxy_pass http://api_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_redirect off;
        proxy_cookie_path /auth /api/auth;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /api {
        return 308 /api/;
    }

    # Vite fingerprints these files. Repeat the security-header include because
    # defining Cache-Control in this location disables normal add_header
    # inheritance on older Nginx releases.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        access_log off;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    # Brand files must fail as static resources, never return the SPA document.
    location ^~ /brand/ {
        try_files $uri =404;
    }

    location = /favicon.ico {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
