# ===========================================
# Docker Compose for Flashcard Generator
# ===========================================
# This file defines all services needed to run the application locally.
#
# Usage:
#   Start development:      docker compose --profile dev up -d --build --wait
#   Start test services:    docker compose --profile test up -d --build --wait
#   View logs:              docker compose logs -f
#   Stop all services:      docker compose down

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  args:
    INSTALL_OCR: ${PDF_OCR_ENABLED:-false}

x-generation-environment: &generation-environment
  GENERATION_SOURCE_ENCRYPTION_KEY: ${GENERATION_SOURCE_ENCRYPTION_KEY:?Set GENERATION_SOURCE_ENCRYPTION_KEY in the root .env file}
  AI_PROVIDER: ${AI_PROVIDER:-gemini}
  AI_MODEL: ${AI_MODEL:-gemini-3.8-flash}
  AI_API_KEY: ${AI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_ALLOW_UNSTABLE_MODEL: ${AI_ALLOW_UNSTABLE_MODEL:-false}
  AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
  AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4096}
  AI_CONTEXT_WINDOW_TOKENS: ${AI_CONTEXT_WINDOW_TOKENS:-1048576}
  AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-90}
  AI_PROVIDER_MAX_RETRIES: ${AI_PROVIDER_MAX_RETRIES:-1}
  AI_RETRY_BASE_SECONDS: ${AI_RETRY_BASE_SECONDS:-1}
  AI_RETRY_MAX_SECONDS: ${AI_RETRY_MAX_SECONDS:-10}
  AI_CONCURRENCY: ${AI_CONCURRENCY:-3}
  AI_CHUNK_INPUT_TOKENS: ${AI_CHUNK_INPUT_TOKENS:-1200}
  AI_CHUNK_OVERLAP_TOKENS: ${AI_CHUNK_OVERLAP_TOKENS:-120}
  AI_SUMMARY_OUTPUT_TOKENS: ${AI_SUMMARY_OUTPUT_TOKENS:-1024}
  AI_MAX_JOB_INPUT_TOKENS: ${AI_MAX_JOB_INPUT_TOKENS:-200000}
  AI_MAX_JOB_OUTPUT_TOKENS: ${AI_MAX_JOB_OUTPUT_TOKENS:-262144}
  AI_INPUT_COST_PER_MILLION_USD: ${AI_INPUT_COST_PER_MILLION_USD:-0}
  AI_OUTPUT_COST_PER_MILLION_USD: ${AI_OUTPUT_COST_PER_MILLION_USD:-0}
  AI_MAX_ESTIMATED_COST_USD: ${AI_MAX_ESTIMATED_COST_USD:-5}
  AI_REFILL_ROUNDS: ${AI_REFILL_ROUNDS:-2}
  AI_DUPLICATE_SIMILARITY_THRESHOLD: ${AI_DUPLICATE_SIMILARITY_THRESHOLD:-0.88}
  PDF_MAX_UPLOAD_BYTES: ${PDF_MAX_UPLOAD_BYTES:-10485760}
  PDF_MAX_PAGES: ${PDF_MAX_PAGES:-100}
  PDF_MAX_EXTRACTED_CHARS: ${PDF_MAX_EXTRACTED_CHARS:-500000}
  PDF_EXTRACTION_TIMEOUT_SECONDS: ${PDF_EXTRACTION_TIMEOUT_SECONDS:-60}
  PDF_EXTRACTION_MEMORY_LIMIT_MB: ${PDF_EXTRACTION_MEMORY_LIMIT_MB:-512}
  GENERATION_MIN_CARD_COUNT: ${GENERATION_MIN_CARD_COUNT:-1}
  GENERATION_MAX_CARD_COUNT: ${GENERATION_MAX_CARD_COUNT:-100}
  GENERATION_MAX_ACTIVE_JOBS_PER_USER: ${GENERATION_MAX_ACTIVE_JOBS_PER_USER:-2}
  GENERATION_MAX_ACTIVE_JOBS_DEPLOYMENT: ${GENERATION_MAX_ACTIVE_JOBS_DEPLOYMENT:-20}
  GENERATION_MAX_QUEUED_JOBS_DEPLOYMENT: ${GENERATION_MAX_QUEUED_JOBS_DEPLOYMENT:-100}
  GENERATION_DAILY_JOBS_PER_USER: ${GENERATION_DAILY_JOBS_PER_USER:-10}
  GENERATION_DAILY_CARDS_PER_USER: ${GENERATION_DAILY_CARDS_PER_USER:-500}
  GENERATION_DAILY_UPLOAD_BYTES_PER_USER: ${GENERATION_DAILY_UPLOAD_BYTES_PER_USER:-104857600}
  GENERATION_DAILY_JOBS_DEPLOYMENT: ${GENERATION_DAILY_JOBS_DEPLOYMENT:-1000}
  GENERATION_DAILY_CARDS_DEPLOYMENT: ${GENERATION_DAILY_CARDS_DEPLOYMENT:-50000}
  GENERATION_DAILY_UPLOAD_BYTES_DEPLOYMENT: ${GENERATION_DAILY_UPLOAD_BYTES_DEPLOYMENT:-10737418240}
  GENERATION_MAX_RETAINED_SOURCE_BYTES_PER_USER: ${GENERATION_MAX_RETAINED_SOURCE_BYTES_PER_USER:-52428800}
  GENERATION_MAX_RETAINED_SOURCE_BYTES_DEPLOYMENT: ${GENERATION_MAX_RETAINED_SOURCE_BYTES_DEPLOYMENT:-1073741824}
  GENERATION_WORKER_CONCURRENCY: ${GENERATION_WORKER_CONCURRENCY:-2}
  GENERATION_JOB_TIMEOUT_SECONDS: ${GENERATION_JOB_TIMEOUT_SECONDS:-600}
  GENERATION_LEASE_SECONDS: ${GENERATION_LEASE_SECONDS:-60}
  GENERATION_WORKER_POLL_SECONDS: ${GENERATION_WORKER_POLL_SECONDS:-1}
  GENERATION_HEARTBEAT_SECONDS: ${GENERATION_HEARTBEAT_SECONDS:-10}
  GENERATION_MAX_ATTEMPTS: ${GENERATION_MAX_ATTEMPTS:-3}
  GENERATION_MAX_MANUAL_RETRIES: ${GENERATION_MAX_MANUAL_RETRIES:-2}
  GENERATION_RETRY_BASE_SECONDS: ${GENERATION_RETRY_BASE_SECONDS:-2}
  GENERATION_RETRY_MAX_SECONDS: ${GENERATION_RETRY_MAX_SECONDS:-60}
  GENERATION_SOURCE_RETRY_RETENTION_HOURS: ${GENERATION_SOURCE_RETRY_RETENTION_HOURS:-24}
  GENERATION_UPLOAD_RESERVATION_MINUTES: ${GENERATION_UPLOAD_RESERVATION_MINUTES:-15}
  GENERATION_CLEANUP_INTERVAL_SECONDS: ${GENERATION_CLEANUP_INTERVAL_SECONDS:-60}
  PDF_OCR_ENABLED: ${PDF_OCR_ENABLED:-false}
  PDF_OCR_LANGUAGE: ${PDF_OCR_LANGUAGE:-eng}
  PDF_OCR_DPI: ${PDF_OCR_DPI:-200}
  PDF_OCR_PAGE_TIMEOUT_SECONDS: ${PDF_OCR_PAGE_TIMEOUT_SECONDS:-30}

services:
  # ===========================================
  # Development/test SMTP capture
  # ===========================================
  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: flashcard_mailpit
    profiles: ["dev", "test"]
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "250"
      MP_MAX_AGE: 7d
      MP_MAX_MESSAGE_SIZE: "2"
      MP_ALLOWED_HOSTS: localhost,127.0.0.1,mailpit
      MP_SMTP_STRICT_RFC_HEADERS: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      MP_IGNORE_DUPLICATE_IDS: "true"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_ENABLE_CHAOS: "true"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ===========================================
  # PostgreSQL Database
  # ===========================================
  db:
    image: postgres:16
    container_name: flashcard_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: flashcard_gen
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d flashcard_gen"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================
  # One-shot schema migration
  # ===========================================
  migrate:
    build: *backend-build
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@db:5432/flashcard_gen
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env file}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: "false"
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      <<: *generation-environment
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: alembic upgrade head
    restart: "no"

  # ===========================================
  # FastAPI Backend
  # ===========================================
  backend:
    build: *backend-build
    container_name: flashcard_backend
    ports:
      - "8000:8000"
    environment:
      # Override DATABASE_URL to use Docker network hostname
      DATABASE_URL: postgresql+asyncpg://admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@db:5432/flashcard_gen
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env file}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      DEBUG: ${DEBUG:-false}
      <<: *generation-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      # Mount source code for hot reloading in development
      - ./backend:/app
    # Override CMD for development (with --reload)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================
  # Durable PDF/AI generation worker
  # ===========================================
  worker:
    build: *backend-build
    container_name: flashcard_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@db:5432/flashcard_gen
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env file}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      <<: *generation-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    command: python -m app.worker
    restart: unless-stopped

  # ===========================================
  # Durable transactional-email worker
  # ===========================================
  email-worker:
    build: *backend-build
    container_name: flashcard_email_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@db:5432/flashcard_gen
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env file}
      GENERATION_SOURCE_ENCRYPTION_KEY: ${GENERATION_SOURCE_ENCRYPTION_KEY:?Set GENERATION_SOURCE_ENCRYPTION_KEY in the root .env file}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: "false"
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      APP_NAME: ${APP_NAME:-Flashcard Generator}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@example.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_IMPLICIT_TLS: ${SMTP_IMPLICIT_TLS:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      EMAIL_WORKER_CONCURRENCY: ${EMAIL_WORKER_CONCURRENCY:-4}
      EMAIL_WORKER_POLL_SECONDS: ${EMAIL_WORKER_POLL_SECONDS:-1}
      EMAIL_LEASE_SECONDS: ${EMAIL_LEASE_SECONDS:-240}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-5}
      EMAIL_RETRY_BASE_SECONDS: ${EMAIL_RETRY_BASE_SECONDS:-5}
      EMAIL_RETRY_MAX_SECONDS: ${EMAIL_RETRY_MAX_SECONDS:-300}
      EMAIL_CLEANUP_INTERVAL_SECONDS: ${EMAIL_CLEANUP_INTERVAL_SECONDS:-3600}
      EMAIL_SENT_RETENTION_DAYS: ${EMAIL_SENT_RETENTION_DAYS:-7}
      EMAIL_FAILED_RETENTION_DAYS: ${EMAIL_FAILED_RETENTION_DAYS:-30}
      EMAIL_SECURITY_NOTIFICATION_EXPIRE_HOURS: ${EMAIL_SECURITY_NOTIFICATION_EXPIRE_HOURS:-24}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    command: python -m app.email_worker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ===========================================
  # Frontend (React + Vite) - Will be added later
