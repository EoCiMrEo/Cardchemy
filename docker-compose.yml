services:
  db:
    image: cardchemy-database:pg16-vector0.8.6-6337fd3bd60ccdfcd8d2aa39ecd4376aad1984a835f651dfba82551bb37a6773
    build:
      context: ./docker/database
      dockerfile: Dockerfile
      labels:
        org.cardchemy.database.recipe-sha256: 6337fd3bd60ccdfcd8d2aa39ecd4376aad1984a835f651dfba82551bb37a6773
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardchemy}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/bootstrap_env.py}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 1m

  migrate:
    image: cardchemy-backend:${APP_VERSION:-local}
    build: *backend-build
    environment:
      <<: *core-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    restart: "no"

  backend:
    image: cardchemy-backend:${APP_VERSION:-local}
    build: *backend-build
    environment:
      <<: [*core-environment, *generation-environment, *rag-profile-environment]
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "--url", "http://localhost:8000/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 45s

  worker:
    image: cardchemy-backend:${APP_VERSION:-local}
    build: *backend-build
    environment:
      <<: [*core-environment, *generation-environment, *rag-profile-environment]
      FLASHCARD_AI_API_KEY: ${FLASHCARD_AI_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "--worker-kind", "generation"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 45s

  index-worker:
    image: cardchemy-backend:${APP_VERSION:-local}
    build: *backend-build
    environment:
      <<: [*core-environment, *rag-profile-environment]
      RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.index_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "--worker-kind", "index"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 45s

  answer-worker:
    image: cardchemy-backend:${APP_VERSION:-local}
    build: *backend-build
    environment:
      <<: [*core-environment, *rag-profile-environment]
      RAG_AI_API_KEY: ${RAG_AI_API_KEY:-}
      RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.answer_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "--worker-kind", "answer"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 45s

  email-worker:
    image: cardchemy-backend:${APP_VERSION:-local}
    build: *backend-build
    environment:
      <<: [*core-environment, *email-environment]
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.email_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "--worker-kind", "email"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 45s

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    expose:
      - "1025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "250"
      MP_MAX_AGE: 7d
      MP_MAX_MESSAGE_SIZE: "2"
      MP_ALLOWED_HOSTS: localhost,127.0.0.1,mailpit
      MP_SMTP_STRICT_RFC_HEADERS: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      MP_IGNORE_DUPLICATE_IDS: "true"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_ENABLE_CHAOS: "true"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  frontend:
    image: cardchemy-frontend:${APP_VERSION:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres_data:
  mailpit_data:
