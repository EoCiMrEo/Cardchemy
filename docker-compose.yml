  AI_PROVIDER_ENABLED: ${AI_PROVIDER_ENABLED:+${CARDCH_LEGACY_AI_CONFIGURATION_ERROR:?Remove AI_PROVIDER_ENABLED; use FLASHCARD_AI_PROVIDER_ENABLED}}
