# Production-shaped local self-hosting stack.
#
# First run:
#   python scripts/bootstrap_env.py
#   docker compose up -d --build --wait
#
# Development and production overrides are documented in docs/DEPLOYMENT.md.

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  target: runtime
  args:
    INSTALL_OCR: ${PDF_OCR_ENABLED:-false}

# Docker Compose reads the root .env for interpolation, but does not pass
# removed keys to containers. Fail during config/up when any old AI name is
# nonempty, with key names only. The Python migration preflight covers native
# processes and provides the complete operator migration inventory.
