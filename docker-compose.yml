# Production-shaped local self-hosting stack.
#
# First run:
#   python scripts/bootstrap_env.py
#   docker compose up -d --build --wait
#
# Development and production overrides are documented in docs/DEPLOYMENT.md.

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  target: runtime
  args:
    INSTALL_OCR: ${PDF_OCR_ENABLED:-false}

x-core-environment: &core-environment
  APP_NAME: ${APP_NAME:-Flashcard Generator}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:?Run python scripts/bootstrap_env.py}@db:5432/${POSTGRES_DB:-flashcard_gen}
  SECRET_KEY: ${SECRET_KEY:?Run python scripts/bootstrap_env.py}
  GENERATION_SOURCE_ENCRYPTION_KEY: ${GENERATION_SOURCE_ENCRYPTION_KEY:?Run python scripts/bootstrap_env.py}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-false}
  ALGORITHM: ${ALGORITHM:-HS256}
  JWT_ISSUER: ${JWT_ISSUER:-flashcard-generator-api}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-flashcard-generator-web}
  JWT_CLOCK_SKEW_SECONDS: ${JWT_CLOCK_SKEW_SECONDS:-30}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  REFRESH_SESSION_EXPIRE_DAYS: ${REFRESH_SESSION_EXPIRE_DAYS:-30}
  REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-flashcard_refresh}
  REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
  REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
  REFRESH_COOKIE_DOMAIN: ${REFRESH_COOKIE_DOMAIN:-}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
  API_ROOT_PATH: ${API_ROOT_PATH:-/api}
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
  INVITATION_MIN_HOURS: ${INVITATION_MIN_HOURS:-1}
  INVITATION_MAX_HOURS: ${INVITATION_MAX_HOURS:-720}
  PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
  WORKER_SHUTDOWN_GRACE_SECONDS: ${WORKER_SHUTDOWN_GRACE_SECONDS:-30}

x-generation-environment: &generation-environment
  # This non-secret admission switch is shared with the API. Provider
  # credentials remain confined to the generation worker below.
  AI_PROVIDER_ENABLED: ${AI_PROVIDER_ENABLED:-false}
  AI_PROVIDER: ${AI_PROVIDER:-gemini}
  AI_MODEL: ${AI_MODEL:-gemini-3.8-flash}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_ALLOW_UNSTABLE_MODEL: ${AI_ALLOW_UNSTABLE_MODEL:-false}
  AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
  AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4096}
  AI_CONTEXT_WINDOW_TOKENS: ${AI_CONTEXT_WINDOW_TOKENS:-1048576}
  AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-90}
  AI_PROVIDER_MAX_RETRIES: ${AI_PROVIDER_MAX_RETRIES:-3}
  AI_RETRY_BASE_SECONDS: ${AI_RETRY_BASE_SECONDS:-3}
  AI_RETRY_MAX_SECONDS: ${AI_RETRY_MAX_SECONDS:-30}
  AI_CONCURRENCY: ${AI_CONCURRENCY:-3}
  AI_CHUNK_INPUT_TOKENS: ${AI_CHUNK_INPUT_TOKENS:-1200}
  AI_CHUNK_OVERLAP_TOKENS: ${AI_CHUNK_OVERLAP_TOKENS:-120}
  AI_SUMMARY_OUTPUT_TOKENS: ${AI_SUMMARY_OUTPUT_TOKENS:-1024}
  AI_MAX_JOB_INPUT_TOKENS: ${AI_MAX_JOB_INPUT_TOKENS:-200000}
  AI_MAX_JOB_OUTPUT_TOKENS: ${AI_MAX_JOB_OUTPUT_TOKENS:-262144}
  AI_INPUT_COST_PER_MILLION_USD: ${AI_INPUT_COST_PER_MILLION_USD:-0}
  AI_OUTPUT_COST_PER_MILLION_USD: ${AI_OUTPUT_COST_PER_MILLION_USD:-0}
  AI_MAX_ESTIMATED_COST_USD: ${AI_MAX_ESTIMATED_COST_USD:-5}
  AI_REFILL_ROUNDS: ${AI_REFILL_ROUNDS:-2}
  AI_DUPLICATE_SIMILARITY_THRESHOLD: ${AI_DUPLICATE_SIMILARITY_THRESHOLD:-0.88}
  PDF_MAX_UPLOAD_BYTES: ${PDF_MAX_UPLOAD_BYTES:-10485760}
  PDF_MAX_PAGES: ${PDF_MAX_PAGES:-100}
  PDF_MAX_EXTRACTED_CHARS: ${PDF_MAX_EXTRACTED_CHARS:-500000}
  PDF_EXTRACTION_TIMEOUT_SECONDS: ${PDF_EXTRACTION_TIMEOUT_SECONDS:-60}
  PDF_EXTRACTION_MEMORY_LIMIT_MB: ${PDF_EXTRACTION_MEMORY_LIMIT_MB:-512}
  GENERATION_MIN_CARD_COUNT: ${GENERATION_MIN_CARD_COUNT:-1}
  GENERATION_MAX_CARD_COUNT: ${GENERATION_MAX_CARD_COUNT:-100}
  GENERATION_MAX_ACTIVE_JOBS_PER_USER: ${GENERATION_MAX_ACTIVE_JOBS_PER_USER:-2}
  GENERATION_MAX_ACTIVE_JOBS_DEPLOYMENT: ${GENERATION_MAX_ACTIVE_JOBS_DEPLOYMENT:-20}
  GENERATION_MAX_QUEUED_JOBS_DEPLOYMENT: ${GENERATION_MAX_QUEUED_JOBS_DEPLOYMENT:-100}
  GENERATION_DAILY_JOBS_PER_USER: ${GENERATION_DAILY_JOBS_PER_USER:-10}
  GENERATION_DAILY_CARDS_PER_USER: ${GENERATION_DAILY_CARDS_PER_USER:-500}
  GENERATION_DAILY_UPLOAD_BYTES_PER_USER: ${GENERATION_DAILY_UPLOAD_BYTES_PER_USER:-104857600}
  GENERATION_DAILY_JOBS_DEPLOYMENT: ${GENERATION_DAILY_JOBS_DEPLOYMENT:-1000}
  GENERATION_DAILY_CARDS_DEPLOYMENT: ${GENERATION_DAILY_CARDS_DEPLOYMENT:-50000}
  GENERATION_DAILY_UPLOAD_BYTES_DEPLOYMENT: ${GENERATION_DAILY_UPLOAD_BYTES_DEPLOYMENT:-10737418240}
  GENERATION_MAX_RETAINED_SOURCE_BYTES_PER_USER: ${GENERATION_MAX_RETAINED_SOURCE_BYTES_PER_USER:-52428800}
  GENERATION_MAX_RETAINED_SOURCE_BYTES_DEPLOYMENT: ${GENERATION_MAX_RETAINED_SOURCE_BYTES_DEPLOYMENT:-1073741824}
  GENERATION_WORKER_CONCURRENCY: ${GENERATION_WORKER_CONCURRENCY:-2}
  GENERATION_JOB_TIMEOUT_SECONDS: ${GENERATION_JOB_TIMEOUT_SECONDS:-600}
  GENERATION_LEASE_SECONDS: ${GENERATION_LEASE_SECONDS:-60}
  GENERATION_WORKER_POLL_SECONDS: ${GENERATION_WORKER_POLL_SECONDS:-1}
  GENERATION_HEARTBEAT_SECONDS: ${GENERATION_HEARTBEAT_SECONDS:-10}
  GENERATION_MAX_ATTEMPTS: ${GENERATION_MAX_ATTEMPTS:-3}
  GENERATION_MAX_MANUAL_RETRIES: ${GENERATION_MAX_MANUAL_RETRIES:-2}
  GENERATION_RETRY_BASE_SECONDS: ${GENERATION_RETRY_BASE_SECONDS:-2}
  GENERATION_RETRY_MAX_SECONDS: ${GENERATION_RETRY_MAX_SECONDS:-60}
  GENERATION_SOURCE_RETRY_RETENTION_HOURS: ${GENERATION_SOURCE_RETRY_RETENTION_HOURS:-24}
  GENERATION_UPLOAD_RESERVATION_MINUTES: ${GENERATION_UPLOAD_RESERVATION_MINUTES:-15}
  GENERATION_CLEANUP_INTERVAL_SECONDS: ${GENERATION_CLEANUP_INTERVAL_SECONDS:-60}
  PDF_OCR_ENABLED: ${PDF_OCR_ENABLED:-false}
  PDF_OCR_LANGUAGE: ${PDF_OCR_LANGUAGE:-eng}
  PDF_OCR_DPI: ${PDF_OCR_DPI:-200}
  PDF_OCR_PAGE_TIMEOUT_SECONDS: ${PDF_OCR_PAGE_TIMEOUT_SECONDS:-30}

x-email-environment: &email-environment
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@example.com}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
  SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  SMTP_IMPLICIT_TLS: ${SMTP_IMPLICIT_TLS:-false}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
  EMAIL_WORKER_CONCURRENCY: ${EMAIL_WORKER_CONCURRENCY:-4}
  EMAIL_WORKER_POLL_SECONDS: ${EMAIL_WORKER_POLL_SECONDS:-1}
  EMAIL_LEASE_SECONDS: ${EMAIL_LEASE_SECONDS:-240}
  EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-5}
  EMAIL_RETRY_BASE_SECONDS: ${EMAIL_RETRY_BASE_SECONDS:-5}
  EMAIL_RETRY_MAX_SECONDS: ${EMAIL_RETRY_MAX_SECONDS:-300}
  EMAIL_CLEANUP_INTERVAL_SECONDS: ${EMAIL_CLEANUP_INTERVAL_SECONDS:-3600}
  EMAIL_SENT_RETENTION_DAYS: ${EMAIL_SENT_RETENTION_DAYS:-7}
  EMAIL_FAILED_RETENTION_DAYS: ${EMAIL_FAILED_RETENTION_DAYS:-30}
  EMAIL_SECURITY_NOTIFICATION_EXPIRE_HOURS: ${EMAIL_SECURITY_NOTIFICATION_EXPIRE_HOURS:-24}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flashcard_gen}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/bootstrap_env.py}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 1m

  migrate:
    image: flashcard-generator-backend:${APP_VERSION:-local}
    build: *backend-build
    environment:
      <<: *core-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    restart: "no"

  backend:
    image: flashcard-generator-backend:${APP_VERSION:-local}
    build: *backend-build
    environment:
      <<: [*core-environment, *generation-environment]
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "--url", "http://localhost:8000/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 45s

  worker:
    image: flashcard-generator-backend:${APP_VERSION:-local}
    build: *backend-build
    environment:
      <<: [*core-environment, *generation-environment]
      AI_API_KEY: ${AI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 45s

  email-worker:
    image: flashcard-generator-backend:${APP_VERSION:-local}
    build: *backend-build
    environment:
      <<: [*core-environment, *email-environment]
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.email_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 45s

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    expose:
      - "1025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "250"
      MP_MAX_AGE: 7d
      MP_MAX_MESSAGE_SIZE: "2"
      MP_ALLOWED_HOSTS: localhost,127.0.0.1,mailpit
      MP_SMTP_STRICT_RFC_HEADERS: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      MP_IGNORE_DUPLICATE_IDS: "true"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_ENABLE_CHAOS: "true"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  frontend:
    image: flashcard-generator-frontend:${APP_VERSION:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres_data:
  mailpit_data:
