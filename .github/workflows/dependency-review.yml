name: Dependency review
on:
  pull_request:
permissions:
  contents: read
jobs:
  dependency-review:
    # Private repositories require GitHub Advanced Security for this API.
    # Full Python/npm locked audits across all scopes remain mandatory in CI.
    if: github.event.repository.private == false || vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: low
          fail-on-scopes: runtime,development,unknown
          comment-summary-in-pr: never
