name: Dependency review
on:
  pull_request:
permissions:
  contents: read
jobs:
  dependency-review:
    # Private repositories require GitHub Advanced Security for this API.
    # Full Python/npm locked audits across all scopes remain mandatory in CI.
    if: github.event.repository.private == false || vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime,development,unknown
          comment-summary-in-pr: never
