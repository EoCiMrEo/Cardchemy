name: Production recovery rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean-install-recovery:
    if: github.repository == 'EoCiMrEo/Cardchemy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Fresh production profile, TLS, backup, separate restore and upgrade
        run: python scripts/test_production_rehearsal.py --evidence "$RUNNER_TEMP/production-rehearsal.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/production-rehearsal.json
          if-no-files-found: error
          retention-days: 90
