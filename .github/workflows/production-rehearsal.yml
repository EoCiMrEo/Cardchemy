name: Production recovery rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean-install-recovery:
    if: github.repository == 'EoCiMrEo/Cardchemy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Fresh production profile, TLS, backup, separate restore and upgrade
        run: python scripts/test_production_rehearsal.py --evidence "$RUNNER_TEMP/production-rehearsal.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/production-rehearsal.json
          if-no-files-found: error
          retention-days: 90
