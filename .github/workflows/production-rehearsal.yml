name: Production recovery rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean-install-recovery:
    if: github.repository == 'EoCiMrEo/Cardchemy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Fresh production profile, TLS, backup, separate restore and upgrade
        run: python scripts/test_production_rehearsal.py --evidence "$RUNNER_TEMP/production-rehearsal.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/production-rehearsal.json
          if-no-files-found: error
          retention-days: 90
