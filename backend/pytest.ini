[pytest]
addopts = -p no:cacheprovider -m "not ai_live"
asyncio_mode = auto
markers =
    ai_live: calls a configured live AI provider and may consume quota
    postgres: requires a disposable PostgreSQL test database at the current Alembic head
    mailpit: requires the disposable Mailpit SMTP/API service
    smtp_tls: requires disposable authenticated TLS SMTP capture services
